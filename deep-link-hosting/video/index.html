<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Responsable</title>
    <!--
        Fallback statique conservé pour les liens déjà partagés vers cette
        URL en .html (avant le passage en .php). Redirige immédiatement vers
        l'équivalent .php, qui génère les balises Open Graph dynamiques
        (miniature, titre, description) — impossible à faire ici puisque ce
        fichier .html n'est pas exécuté en PHP par le serveur.
    -->
    <script>
        window.location.replace('index.php' + window.location.search);
    </script>
    <meta http-equiv="refresh" content="0; url=index.php">
</head>

<body>
    <p>Redirection en cours... Si rien ne se passe, <a id="fallback-link" href="index.php">cliquez ici</a>.</p>
    <script>
        document.getElementById('fallback-link').href = 'index.php' + window.location.search;
    </script>
</body>

</html>
